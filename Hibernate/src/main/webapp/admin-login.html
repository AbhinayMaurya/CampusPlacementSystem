<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #2c3e50;"> <div class="container">
        <h2 style="color: #c0392b;">Admin Portal</h2>
        
        <form action="auth" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Admin Username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Admin Password" required>
            </div>

            <input type="hidden" name="action" value="admin-login">

            <button type="submit" style="background-color: #c0392b;">Login as Admin</button>
        </form>
        
        <a href="login.html">Back to Student Login</a>
    </div>

</body>
</html>
