<!DOCTYPE html>
<html>
<head>
    <title>Login - Campus Placement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h2>Student Login</h2>
        
        <div id="error-msg" class="error">Invalid Credentials</div>

        <form action="auth" method="post">
            
            <div class="form-group">
                <label>Email ID</label>
                <input type="email" name="email" placeholder="Enter college email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <input type="hidden" name="action" value="login">

            <button type="submit">Login Securely</button>
        </form>

        <a href="register.html">New Student? Register Here</a>
        <br>
        <a href="admin-login.html" style="color: #666;">Admin Login</a>
    </div>

</body>
</html>
